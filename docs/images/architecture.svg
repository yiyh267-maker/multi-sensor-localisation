<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Multi-sensor localisation architecture</title>
<desc id="desc">LiDAR odometry and IMU measurements feed an EKF. Filtered odometry, scans and camera images feed RTAB-Map. The dashboard bridge receives local transforms, map paths and GNSS fixes and sends them to the browser.</desc>
